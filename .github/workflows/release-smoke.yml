name: Manual release build checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    name: Android arm64 temporary-signing build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.50.0 stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Build and verify Android APK with a temporary certificate
        shell: bash
        run: |
          set -euo pipefail

          keystore="$RUNNER_TEMP/notes-ci-release.p12"
          properties="$GITHUB_WORKSPACE/android/key.properties"
          cleanup() {
            rm -f "$keystore" "$properties"
          }
          trap cleanup EXIT

          store_password="$(openssl rand -hex 24)"
          echo "::add-mask::$store_password"
          key_password="$store_password"
          echo "::add-mask::$key_password"

          keytool -genkeypair -noprompt \
            -keystore "$keystore" \
            -storetype PKCS12 \
            -storepass "$store_password" \
            -keypass "$key_password" \
            -alias notes-ci \
            -dname 'CN=Notes CI Temporary,O=Notes CI,C=US' \
            -keyalg RSA -keysize 2048 -validity 2

          umask 077
          cat > "$properties" <<EOF
          storeFile=$keystore
          storePassword=$store_password
          keyAlias=notes-ci
          keyPassword=$key_password
          EOF

          flutter pub get
          flutter build apk --release --target-platform android-arm64

          apk='build/app/outputs/flutter-apk/app-release.apk'
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          aapt="$build_tools/aapt"
          test -x "$apksigner"
          test -x "$aapt"

          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apksigner.txt"
          expected_cert="$(keytool -exportcert -keystore "$keystore" -storepass "$store_password" -alias notes-ci | sha256sum | cut -d ' ' -f 1)"
          actual_cert="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test -n "$actual_cert"
          test "$actual_cert" = "$expected_cert"

          app_id="$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          version_name="$("$aapt" dump badging "$apk" | sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          version_code="$("$aapt" dump badging "$apk" | sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
          expected_name="$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)"
          expected_code="$(sed -n 's/^version: [^+]*+\([0-9][0-9]*\).*/\1/p' pubspec.yaml)"
          test "$app_id" = 'com.mmoptibuilds.notes'
          test "$version_name" = "$expected_name"
          test "$version_code" = "$expected_code"
          unzip -Z1 "$apk" | grep -q '^lib/arm64-v8a/'
          echo 'Android temporary-signing build checks passed.'

  linux-x64:
    name: Linux x64 package build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter 3.50.0 stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Install Flutter Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake libgtk-3-dev libsecret-1-dev ninja-build pkg-config

      - name: Build and verify Linux package
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          tool/package_linux.sh

          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          package="dist/notes-${version}-linux-x64.tar.gz"
          package_dir="notes-${version}-linux-x64"
          listing="$RUNNER_TEMP/linux-package-files.txt"
          tar -tzf "$package" > "$listing"

          grep -qx "${package_dir}/bundle/notes" "$listing"
          grep -q "^${package_dir}/bundle/lib/.*\.so" "$listing"
          grep -qx "${package_dir}/install.sh" "$listing"
          grep -qx "${package_dir}/uninstall.sh" "$listing"
          grep -qx "${package_dir}/update/notes-update-helper" "$listing"
          grep -qx "${package_dir}/com.mmoptibuilds.notes.desktop" "$listing"
          grep -qx "${package_dir}/notes.png" "$listing"
          grep -qx "${package_dir}/BUILD" "$listing"
          test "$(grep -c "^${package_dir}/.*-OFL\.txt$" "$listing")" -eq 4

          mkdir -p "$RUNNER_TEMP/linux-package"
          tar -xzf "$package" -C "$RUNNER_TEMP/linux-package"
          test -x "$RUNNER_TEMP/linux-package/${package_dir}/bundle/notes"
          test -x "$RUNNER_TEMP/linux-package/${package_dir}/install.sh"
          test -x "$RUNNER_TEMP/linux-package/${package_dir}/uninstall.sh"
          test -x "$RUNNER_TEMP/linux-package/${package_dir}/update/notes-update-helper"
          (cd dist && sha256sum -c "$(basename "$package").sha256")
          echo 'Linux x64 package checks passed.'
